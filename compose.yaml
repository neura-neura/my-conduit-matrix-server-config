name: ${COMPOSE_PROJECT_NAME:-conduit-matrix}

services:
  conduit:
    image: ${CONDUIT_IMAGE:-matrixconduit/matrix-conduit:latest}
    container_name: ${CONDUIT_CONTAINER:-conduit}
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/config/conduit.toml:/etc/matrix-conduit/conduit.toml:ro
      - ${DATA_DIR}/conduit:/var/lib/matrix-conduit
    environment:
      CONDUIT_CONFIG: /etc/matrix-conduit/conduit.toml

  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:latest}
    container_name: ${LIVEKIT_CONTAINER:-livekit-server}
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "${HOST_IP:?Set HOST_IP in .env}:${LIVEKIT_TCP_PORT:-7881}:7881"
      - "${HOST_IP:?Set HOST_IP in .env}:${LIVEKIT_UDP_PORT:-7882}:7882/udp"
    volumes:
      - ${DATA_DIR}/config/livekit.yaml:/etc/livekit.yaml:ro

  lk-jwt:
    image: ${LK_JWT_IMAGE:-ghcr.io/element-hq/lk-jwt-service:latest}
    container_name: ${LK_JWT_CONTAINER:-lk-jwt-service}
    restart: unless-stopped
    environment:
      LIVEKIT_URL: wss://${SERVER_NAME}/livekit/sfu
      LIVEKIT_KEY: ${LIVEKIT_KEY}
      LIVEKIT_SECRET: ${LIVEKIT_SECRET}
      LIVEKIT_FULL_ACCESS_HOMESERVERS: "${SERVER_NAME}"
      LIVEKIT_CS_API_URL_OVERRIDES: "${SERVER_NAME}=https://${SERVER_NAME}"
      LIVEKIT_INSECURE_SKIP_VERIFY_TLS: YES_I_KNOW_WHAT_I_AM_DOING
      LIVEKIT_LOG_LEVEL: info

  proxy:
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: ${PROXY_CONTAINER:-conduit-proxy}
    restart: unless-stopped
    ports:
      - "${HOST_IP:?Set HOST_IP in .env}:${MATRIX_PORT:-6167}:80"
      - "${HOST_IP:?Set HOST_IP in .env}:${FEDERATION_PORT:-8448}:443"
    volumes:
      - ${DATA_DIR}/config/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ${DATA_DIR}/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DATA_DIR}/certs:/etc/nginx/certs:ro
    depends_on:
      - conduit
      - livekit
      - lk-jwt

  cinny:
    image: ${CINNY_IMAGE:-ghcr.io/cinnyapp/cinny:latest}
    container_name: ${CINNY_CONTAINER:-cinny-web}
    restart: unless-stopped
    ports:
      - "${HOST_IP:?Set HOST_IP in .env}:${CINNY_PORT:-6168}:80"
